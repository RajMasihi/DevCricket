name: Deploy CricketApp

on:
  push:
    branches:
      - main
# update
# on:
#   workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login DockerHub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | \
          docker login \
          -u "${{ secrets.DOCKER_USERNAME }}" \
          --password-stdin

      - name: Build Image
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/cricketapp:latest .

      - name: Push Image
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/cricketapp:latest

      - name: Deploy to EC2
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > key.pem
          chmod 600 key.pem

          ssh -o StrictHostKeyChecking=no \
          -i key.pem \
          ubuntu@${{ secrets.EC2_IP }} << 'EOF'

          cd ~/cricketapp

          pwd
          ls -la
          git pull origin main
          npm run build
          docker compose pull

          docker compose down

          docker compose up -d

          docker compose ps
          git reset --hard
       
          docker exec cricketapp-app-1 php artisan config:clear
          docker exec cricketapp-app-1 php artisan view:clear
          docker exec cricketapp-app-1 php artisan optimize:clear
          EOF

          rm -f key.pem
