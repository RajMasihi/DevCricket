



services:

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  app:
    image: rajmasihi63/cricketapp:latest
    restart: always
    env_file:
      - .env
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app