server {

    listen 443 ssl;
    server_name criclivem.online www.criclivem.online;

    ssl_certificate /etc/letsencrypt/live/criclivem.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/criclivem.online/privkey.pem;

    root /var/www/public;

    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {

        fastcgi_pass app:9000;

        fastcgi_index index.php;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }


    location ~ /\. {
        deny all;
    }

    location ~* \.(env|log|ini)$ {
        deny all;
    }
}
