server {
    listen 80;
    server_name localhost;

    root /var/www/public;
    index index.php index.html;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        # 1. CRITICAL FIX: Prevents PHP-FPM path info bugs & 500 errors
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # 2. Verify this matches your PHP container name in docker-compose.yml
        fastcgi_pass app:9000;

        fastcgi_index index.php;
        include fastcgi_params;

        # 3. CRITICAL FIX: Ensure absolute path resolution works after redeploy
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # 4. Pass path info correctly to PHP
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Optional: Increase timeouts for heavy requests
        fastcgi_read_timeout 300;
    }

    # Deny access to hidden files (.env, .git, .htaccess, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive file extensions
    location ~* \.(env|log|ini|sh|sql)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Optional: Handle static assets efficiently
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 6M;
        access_log off;
    }
}
